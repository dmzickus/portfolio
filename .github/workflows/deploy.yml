name: Deploy to GitHub Pages

# Builds the site from content/ with build/build.py and publishes website/.
# Build and deploy are separate jobs (GitHub's recommended layout): the deploy
# job only starts after the artifact upload has fully finished, which fixes the
# intermittent "No artifacts named github-pages" failure on the first run.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build/requirements.txt
      - name: Install system libraries for PDF rendering
        run: sudo apt-get update -q && sudo apt-get install -y -q libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r build/requirements.txt
      - run: python build/build.py --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
