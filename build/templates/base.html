<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:type" content="{{OG_TYPE}}">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">

</head>
<body class="{{BODY_CLASS}}">
<a class="skip" href="#main">Skip to content</a>

</nav>
<main id="main">
{{BODY}}
</main>

  <div class="footer-social">{{SOCIAL}}</div>
  <p>© {{YEAR}} Dylan Zickus · <a class="quiet" href="/brand/">Spotty Connection</a><span class="show-only"> · <a href="/brand/#lore">Intermission</a></span></p>

  <a class="trap" href="/signal-lost/" rel="nofollow" tabindex="-1" aria-hidden="true">signal diagnostics</a>
